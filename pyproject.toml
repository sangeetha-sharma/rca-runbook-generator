[project]
name = "rca-runbook-generator"
version = "0.1.0"
description = "Backend that ingests alerts, deduplicates them into incidents, reports MTTA/MTTR with SQL, and drafts RCAs with an LLM for human review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "greenlet>=3.5.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]